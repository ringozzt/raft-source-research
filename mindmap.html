<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raft（agent 原生工作区）· 交互思维导图</title>
<style>
  :root { --bg:#0f1419; --panel:#182028; --line:#2b3642; --text:#d7dee6; --dim:#8b98a5; --acc:#4cc38a; --warn:#f5a524; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:28px 32px 8px; max-width:1100px; margin:0 auto; }
  header h1 { margin:0 0 6px; font-size:24px; }
  header p { margin:0; color:var(--dim); font-size:14px; }
  header a { color:var(--acc); text-decoration:none; }
  #tree { max-width:1100px; margin:0 auto; padding:16px 32px 64px; }
  ul { list-style:none; margin:0; padding-left:22px; border-left:1px solid var(--line); }
  #tree > ul { border-left:none; padding-left:0; }
  li { margin:6px 0; }
  .node { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:14px; cursor:pointer; user-select:none; }
  .node:hover { border-color:var(--acc); }
  .node .tag { font-size:11px; border-radius:4px; padding:1px 6px; margin-left:8px; vertical-align:1px; }
  .tag-p { background:#123a2a; color:var(--acc); }
  .tag-s { background:#3a2f12; color:var(--warn); }
  .node .caret { color:var(--dim); margin-right:6px; font-size:11px; }
  .collapsed > ul { display:none; }
  .leaf { cursor:default; }
  .leaf:hover { border-color:var(--line); }
  .legend { max-width:1100px; margin:0 auto; padding:0 32px; color:var(--dim); font-size:12px; }
  footer { max-width:1100px; margin:0 auto; padding:0 32px 40px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Raft（agent 原生工作区）· 交互思维导图</h1>
  <p>点击节点展开 / 折叠 · 数据来源见同目录 README · 调研时间 2026-10-14</p>
</header>
<p class="legend"><span class="tag tag-p" style="font-size:11px;border-radius:4px;padding:1px 6px;">P</span> 一手来源（仓库/官网）　<span class="tag tag-s" style="font-size:11px;border-radius:4px;padding:1px 6px;">S</span> 二手来源（媒体/指南）</p>
<div id="tree"><ul id="root"></ul></div>
<footer>独立第三方调研，与 botiverse/raft-source 项目无关。star 数为快照，持续变化中。</footer>
<script>
const T = (t, tag, children) => ({t, tag, c: children || []});
const data = [
  T("是什么", "P", [
    T("Botiverse 的 agent 原生工作区：team mode for your agents"),
    T("agent = 持久队友：身份、记忆、能力范围，真进程跑在真机器"),
    T("频道 / 私信 / 任务 / @mention，人与 agent 并肩协作"),
    T("曾用名 Slock，2026-07 改名；旧名全留作兼容层", "P"),
  ]),
  T("时间线与热度", null, [
    T("公司成立于 2025（第三方指南）", "S"),
    T("2026-09-15 发布镜像仓库创建", "P"),
    T("596 stars / 114 forks（2026-10-14），Issues 关闭、PR 自动关闭", "P"),
    T("官网 testimonials：TiDB 联创称高峰期一天烧 12 亿 token（厂商证言）", "S"),
  ]),
  T("架构：monorepo", "P", [
    T("server：API + Socket.IO 实时 + Postgres/Redis/对象存储；replicaRouter 经 Redis pub/sub 横向扩展"),
    T("daemon：机器守护进程，12 种 runtime driver + 事件归一化，凭据本地代理代持"),
    T("computer：SEA 二进制安装器，把机器注册进服务器（不再走 npm）"),
    T("web：客户端；cli：人/agent 共用，daemon 注入 agent 进程"),
    T("sync-core：纯确定性同步状态机（RFC 043），帧/快照/差量，无传输无时钟"),
    T("trace-client / trace-upload-worker：agent 运行轨迹采集"),
  ]),
  T("runtime：12 种可混搭", "P", [
    T("Claude Code / Codex / Grok Build / Kimi Code（新首选）/ Cursor / OpenCode / Pi / Built-in Pi"),
    T("deprecated：Antigravity / Copilot / Gemini / Kimi CLI"),
    T("一个 agent 一生一种 runtime；同服不同 agent 可混搭；runtime 按电脑安装"),
    T("external-agent：自带机器与 runtime，raft agent login 接入即正式成员"),
    T("用你自己的模型订阅与 key（官网 FAQ 原话）"),
  ]),
  T("协作机制", "P", [
    T("task：认领制工作项，建在消息之上"),
    T("inbox：跨 surface 注意力聚合；reminder：agent 自设定时唤醒，可 snooze"),
    T("action-cards：agent 代笔、人类 commit 的落印模式"),
    T("joint-channel：恰两服之间的共享频道，消息/回执同步"),
    T("manual/：产品手册即 agent 知识库，raft manual get 需声明 intent/reason"),
  ]),
  T("权限：两轴正交", "P", [
    T("Raft scopes：工作区内能力，admin 授予，缺了就 SCOPE_DENIED，agent 不能自授"),
    T("runtime + substrate：工作区外的一切，取决于 runtime 工具基线 × 你的电脑"),
    T("手册原话：最常见的用户困惑就是把两轴混为一谈"),
    T("凭据永不进 agent 手；revoke 会话连带驱逐 realtime 订阅"),
    T("诚实边界：默认看不到你的浏览器标签页，进不了你的交互式终端"),
  ]),
  T("与 oar 的关系", "P", [
    T("daemon 依赖 @botiverse/oar@0.56.0"),
    T("只用于 runtime 账号用量采集与适配（oarAdapter.ts：投影、脱敏、窗口上限）"),
    T("oar（Apache-2.0）与 Raft（FSL）许可不同；用量采集是 oar 在 Raft 内的唯一已知用途"),
  ]),
  T("许可：看得见 ≠ 开源", "P", [
    T("FSL-1.1-ALv2：可读可跑可改，禁竞争性商用；版本满两年自动转 Apache-2.0"),
    T("仓库是单向发布镜像：私有开发，一 release 一 snapshot commit"),
    T("不收 PR（自动关闭）、不开 Issues；快照永远比线上旧一拍"),
    T("snapshot 由自家 agent 提交（Tenny@agents.stamp.build）"),
  ]),
  T("使用注意", null, [
    T("Competing Use 以 LICENSE 文本为准；2026-09 版本 2028-09 转 Apache-2.0", "P"),
    T("agent 用用户自有订阅与 key（官网 FAQ）；多人共用场景条款未在官方文本中找到说明", "P"),
    T("凭据 broker 与用量采集都经过 Botiverse 代码与托管面", "P"),
    T("生态（recipes/playbook）刚起步；仓库不收 PR、不开 Issues", "P"),
  ]),
  T("未核实", null, [
    T("Hermes Agent 是何物（官网 FAQ 有，drivers 里没有）"),
    T("oar 在私有仓是否有更深集成"),
    T("Free/Pro 具体价格与 agent 上限"),
  ]),
];
function render(nodes, parent) {
  nodes.forEach(n => {
    const li = document.createElement("li");
    const div = document.createElement("div");
    div.className = "node" + (n.c.length ? "" : " leaf");
    div.innerHTML = (n.c.length ? '<span class="caret">▾</span>' : "") +
      n.t + (n.tag ? `<span class="tag tag-${n.tag.toLowerCase()}">${n.tag}</span>` : "");
    if (n.c.length) div.onclick = e => {
      if (e.target.closest(".node") !== div) return;
      li.classList.toggle("collapsed");
      div.querySelector(".caret").textContent = li.classList.contains("collapsed") ? "▸" : "▾";
    };
    li.appendChild(div);
    if (n.c.length) { const ul = document.createElement("ul"); render(n.c, ul); li.appendChild(ul); }
    parent.appendChild(li);
  });
}
render(data, document.getElementById("root"));
</script>
</body>
</html>
